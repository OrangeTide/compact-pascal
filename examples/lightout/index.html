<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light's Out</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      text-align: center;
    }

    h1 {
      margin-bottom: 1rem;
      color: #333;
      font-size: 2rem;
    }

    #canvas {
      border: 2px solid #333;
      background: white;
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
    }

    .info {
      margin-top: 1rem;
      color: #666;
      font-size: 0.9rem;
    }

    .info p {
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Light's Out</h1>
    <canvas id="canvas" width="500" height="600"></canvas>
    <div class="info">
      <p>Click cells to toggle them and their neighbors.</p>
      <p>Clear all lights to win!</p>
    </div>
  </div>

  <script src="host.js"></script>
</body>
</html>
