[workspace]
members = []

[package]
name = "compact-pascal"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Embeddable Pascal-to-WASM compiler"
authors = ["Jon Mayo"]
license = "CC0-1.0"

[lib]
path = "src/rust/lib.rs"

[[example]]
name = "hello"
path = "examples/rust/hello/main.rs"

[[example]]
name = "calculator"
path = "examples/rust/calculator/main.rs"

[[example]]
name = "host-callback"
path = "examples/rust/host-callback/main.rs"

[dependencies]
wasmi = "1.0"

[profile.release]
opt-level = 3
lto = true
